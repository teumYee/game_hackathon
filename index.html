<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1c">
  <title>오늘도 갓생 살아볼까요?</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #080d1c;
      color: #f7f8ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(ellipse at 50% 0%, #202c4b 0%, #0b1223 52%, #060912 100%);
    }
    .page { width: min(1120px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 4px 16px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); letter-spacing: -.04em; }
    .subtitle { margin: 7px 0 0; color: #aebbd7; font-size: 15px; }
    .controls { color: #c8d3ea; font-size: 14px; white-space: nowrap; }
    .game-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid rgba(181, 202, 255, .3);
      border-radius: 18px;
      background: #080d1c;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .5), 0 0 50px rgba(71, 111, 220, .13);
    }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; background: #080d1c; }
    .loading {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 16px;
      padding: 24px; text-align: center; background: rgba(5, 9, 20, .94);
    }
    .loading[hidden] { display: none; }
    .loading-title { font-size: 19px; font-weight: 700; }
    .track { width: min(340px, 70vw); height: 9px; overflow: hidden; border-radius: 99px; background: #27324d; }
    .progress { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5b9aff, #7ee0ff); transition: width .15s linear; }
    .loading-note, .error { color: #b7c5e1; font-size: 14px; }
    .error { color: #ff9ba2; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 12px 4px 0; color: #93a1bd; font-size: 13px; }
    button {
      border: 1px solid rgba(186, 207, 255, .34); border-radius: 10px; padding: 9px 15px;
      color: #f7f8ff; background: #172747; font: inherit; cursor: pointer;
    }
    button:hover { background: #223860; }
    @media (max-width: 650px) {
      body { padding: 12px; }
      header { display: block; }
      .controls { margin-top: 10px; white-space: normal; }
      .game-frame { border-radius: 10px; }
      footer { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>오늘도 갓생 살아볼까요?</h1>
        <p class="subtitle">갓생 대학생의 45초 생존기</p>
      </div>
      <div class="controls">조작: ← → 또는 A / D</div>
    </header>

    <section class="game-frame" aria-label="Unity WebGL 게임">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div class="loading" id="loading">
        <div class="loading-title">게임 준비 중</div>
        <div class="track"><div class="progress" id="progress"></div></div>
        <div class="loading-note" id="loading-note">잠시만 기다려주세요.</div>
      </div>
    </section>

    <footer>
      <span>45초 동안 살아남고 스펙을 모아보세요.</span>
      <button id="fullscreen" type="button">전체 화면</button>
    </footer>
  </main>

  <script src="Build/WebGL/Build/WebGL.loader.js"></script>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const progress = document.getElementById("progress");
    const loadingNote = document.getElementById("loading-note");
    let unityInstance = null;

    const config = {
      dataUrl: "Build/WebGL/Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL/Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL/Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "Build/WebGL/StreamingAssets",
      companyName: "DefaultCompany",
      productName: "오늘도 갓생 살아볼까요?",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    if (typeof createUnityInstance !== "function") {
      loadingNote.className = "error";
      loadingNote.textContent = "Unity WebGL 로더를 찾지 못했습니다. Build/WebGL/Build 폴더를 확인해주세요.";
    } else {
      createUnityInstance(canvas, config, (value) => {
        progress.style.width = Math.round(value * 100) + "%";
      }).then((instance) => {
        unityInstance = instance;
        loading.hidden = true;
        canvas.focus();
      }).catch((error) => {
        loadingNote.className = "error";
        loadingNote.textContent = "게임을 불러오지 못했습니다. WebGL 빌드 파일을 확인해주세요.";
        console.error(error);
      });
    }

    document.getElementById("fullscreen").addEventListener("click", () => {
      if (unityInstance) unityInstance.SetFullscreen(1);
    });
  </script>
</body>
</html>
